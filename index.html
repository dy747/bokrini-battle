<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: 16:9 pixel arena centered in the viewport; HUD inside the arena; joystick + punch buttons pinned to the screen corners. Single committed night-arcade look. */
:root{
  color-scheme:dark;
  --bg:#07060f; --panel:#151233; --line:#3a3270; --chalk:#f6efe3; --dim:#a39cc9;
  --red:#ff3b55; --blue:#3f7bff; --gold:#ffd23a; --pink:#ff4fb0;
  --f-display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  --f-px:"Press Start 2P","Noto Sans KR",monospace;
  --u:2;--lh:1vh;
}
html,body{height:100%;overscroll-behavior:none;overflow:hidden}
body{position:fixed;inset:0}
body{margin:0;background:var(--bg);color:var(--chalk);font-family:var(--f-body);overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#game{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:640px;height:360px;background:#000;overflow:hidden}
#cv{display:block;position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}

/* HUD */
#hud{position:absolute;inset:0 0 auto 0;display:grid;grid-template-columns:1fr auto 1fr;gap:calc(var(--u)*6px);
  padding:calc(var(--u)*4px) calc(var(--u)*6px);pointer-events:none}
.pl{display:grid;grid-template-columns:auto 1fr;gap:calc(var(--u)*3px);align-items:start}
.pl.r{grid-template-columns:1fr auto}
.por{width:calc(var(--u)*20px);height:calc(var(--u)*20px);image-rendering:pixelated;border:calc(var(--u)*1px) solid var(--chalk);background:#2a1f4d}
.pl.l .por{border-color:var(--red)}.pl.r .por{border-color:var(--blue);order:2}
.info{display:flex;flex-direction:column;gap:calc(var(--u)*1.5px);min-width:0}
.pl.r .info{align-items:flex-end}
.nm{font-family:var(--f-display);font-size:calc(var(--u)*7.5px);line-height:1;white-space:nowrap;text-shadow:0 1px 0 #000}
.nm b{font-family:var(--f-px);font-size:calc(var(--u)*5px);color:var(--red);margin-right:calc(var(--u)*3px)}
.pl.r .nm b{color:var(--blue);margin:0 0 0 calc(var(--u)*3px)}
.hp{position:relative;width:100%;height:calc(var(--u)*6px);background:#14051a;border:calc(var(--u)*0.8px) solid var(--chalk);box-sizing:border-box;overflow:hidden;transform:skewX(-14deg)}
.pl.r .hp{transform:skewX(14deg)}
.hp i{position:absolute;top:0;bottom:0;right:0}
.pl.r .hp i{right:auto;left:0}
.hp .drain{background:#fff;opacity:.8}.hp .fill{background:linear-gradient(var(--gold),#ffb000)}
.hp .fill.low{background:linear-gradient(#ff7a7a,var(--red))}
.sp{display:flex;align-items:center;gap:calc(var(--u)*2px);width:100%}
.pl.r .sp{flex-direction:row-reverse}
.sp span{font-family:var(--f-px);font-size:calc(var(--u)*3.6px);color:#7fb4ff}
.sbar{flex:1;max-width:calc(var(--u)*60px);height:calc(var(--u)*3px);background:#0b1030;border:1px solid #4a63b8;overflow:hidden;position:relative}
.sbar i{position:absolute;top:0;bottom:0;left:0;background:#46a0ff}
.pl.r .sbar i{left:auto;right:0}
.sbar.full i{background:var(--gold);animation:glow .4s steps(2) infinite}
@keyframes glow{50%{background:#fff}}
.dots{display:flex;gap:calc(var(--u)*1.5px)}
.dots i{width:calc(var(--u)*4px);height:calc(var(--u)*4px);border-radius:50%;border:1px solid var(--chalk);box-sizing:border-box}
.dots i.on{background:var(--gold);border-color:var(--gold)}
.mid{text-align:center;line-height:1;padding-top:calc(var(--u)*1px)}
.mid small{display:block;font-family:var(--f-px);font-size:calc(var(--u)*3.6px);color:var(--chalk)}
.mid span{font-family:var(--f-px);font-size:calc(var(--u)*11px);color:var(--gold);text-shadow:0 calc(var(--u)*1px) 0 #8a3d00;display:block;margin-top:calc(var(--u)*2px);font-variant-numeric:tabular-nums}
#sndBtn{position:absolute;left:calc(var(--u)*34px);top:calc(var(--u)*30px);width:calc(var(--u)*11px);height:calc(var(--u)*11px);background:rgba(10,8,30,.6);border:1px solid var(--chalk);padding:0;cursor:pointer;font-size:calc(var(--u)*5.5px);line-height:1}
#fsBtn{position:absolute;left:calc(var(--u)*20px);top:calc(var(--u)*30px);width:calc(var(--u)*11px);height:calc(var(--u)*11px);background:rgba(10,8,30,.6);border:1px solid var(--chalk);color:var(--chalk);font:900 calc(var(--u)*6px) var(--f-body);padding:0;cursor:pointer;line-height:1}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);z-index:30;max-width:calc(100% - 32px);box-sizing:border-box;background:#1d1840;border:2px solid var(--gold);color:var(--chalk);font:700 13px/1.5 var(--f-body);padding:10px 14px;text-align:center}
#pauseBtn{position:absolute;left:calc(var(--u)*6px);top:calc(var(--u)*30px);width:calc(var(--u)*11px);height:calc(var(--u)*11px);
  background:rgba(10,8,30,.6);border:1px solid var(--chalk);color:var(--chalk);font:900 calc(var(--u)*5px) var(--f-body);padding:0;cursor:pointer;pointer-events:auto}

#pops{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:calc(var(--u)*9px);white-space:nowrap;
  color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;animation:rise .75s ease-out forwards}
.pop.cnt{color:var(--gold);font-size:calc(var(--u)*11px)}
.pop.mid{color:#bfe0ff;font-size:calc(var(--u)*7px)}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-160%)}}
.combo{position:absolute;top:calc(var(--u)*48px);font-family:var(--f-px);font-size:calc(var(--u)*6px);color:var(--gold);text-shadow:2px 2px 0 #000;pointer-events:none}
.combo b{display:block;font-size:calc(var(--u)*12px)}
#c1{left:calc(var(--u)*8px)}#c2{right:calc(var(--u)*8px);text-align:right}
#callout{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center}
#callout div{font-family:var(--f-display);font-size:calc(var(--u)*26px);line-height:1.05;color:var(--chalk);
  text-shadow:calc(var(--u)*1.2px) calc(var(--u)*1.2px) 0 var(--red),calc(var(--u)*2.4px) calc(var(--u)*2.4px) 0 #000}
#callout div.sup{font-size:calc(var(--u)*20px);color:var(--gold);text-shadow:calc(var(--u)*1.2px) calc(var(--u)*1.2px) 0 var(--red),0 0 calc(var(--u)*10px) var(--red)}
#callout div.vs{font-size:calc(var(--u)*17px)}
#callout div.on{animation:slam .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{0%{transform:scale(2.4);opacity:0}100%{transform:scale(1);opacity:1}}
#flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,59,85,.65));opacity:0}
#flash.on{animation:fl .3s ease-out}
@keyframes fl{0%{opacity:1}100%{opacity:0}}

/* Controls */
#ctl{position:fixed;inset:0;pointer-events:none;z-index:3}
#ctl[hidden]{display:none!important}
#joy{position:absolute;left:max(30px,calc(env(safe-area-inset-left,0px) + 22px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  width:clamp(104px,calc(var(--lh,1vh) * 33),150px);aspect-ratio:1;border-radius:50%;pointer-events:auto;touch-action:none;
  background:radial-gradient(circle,rgba(30,40,110,.45) 55%,rgba(20,24,70,.65));border:2px solid rgba(110,150,255,.85);
  box-shadow:0 0 14px rgba(63,123,255,.6),inset 0 0 16px rgba(63,123,255,.35)}
#joy::before,#joy::after{content:"";position:absolute;left:50%;top:50%;width:0;height:0;border:7px solid transparent}
#joy::before{border-right-color:rgba(255,255,255,.7);transform:translate(calc(-50% - clamp(36px,calc(var(--lh,1vh) * 11),52px)),-50%)}
#joy::after{border-left-color:rgba(255,255,255,.7);transform:translate(calc(-50% + clamp(36px,calc(var(--lh,1vh) * 11),52px)),-50%)}
#joy{opacity:.38;transition:opacity .15s}
#joy.on{opacity:.8}
#knob{position:absolute;left:50%;top:50%;width:42%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 30%,#e9ecff,#7f86b5 60%,#3b3f66);box-shadow:0 3px 8px rgba(0,0,0,.6)}
#btns{position:absolute;right:max(14px,calc(env(safe-area-inset-right,0px) + 8px));bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
  display:grid;grid-template-columns:repeat(3,clamp(48px,calc(var(--lh,1vh) * 15),66px));grid-auto-rows:clamp(48px,calc(var(--lh,1vh) * 15),66px);gap:clamp(6px,calc(var(--lh,1vh) * 2),10px);pointer-events:none}
.b{pointer-events:auto;touch-action:none;border-radius:50%;border:2px solid;display:grid;place-items:center;
  font:900 clamp(11px,calc(var(--lh,1vh) * 3.4),14px)/1.1 var(--f-body);color:#fff;text-align:center;cursor:pointer;padding:0;
  background:rgba(14,10,36,.62);box-shadow:inset 0 0 10px rgba(0,0,0,.6)}
.b small{display:block;font:400 clamp(7px,calc(var(--lh,1vh) * 2.2),9px) var(--f-px);opacity:.75;margin-top:2px}
.b.rd{border-color:var(--red);box-shadow:0 0 8px rgba(255,59,85,.55),inset 0 0 10px rgba(255,59,85,.25)}
.b.bl{border-color:var(--blue);box-shadow:0 0 8px rgba(63,123,255,.55),inset 0 0 10px rgba(63,123,255,.25)}
.b.gd{border-color:#9aa3c9}
.b.su{border-color:#665b2a;color:#8a7f52;font-size:clamp(9px,calc(var(--lh,1vh) * 2.8),12px)}
.b.su.ready{border-color:var(--gold);color:var(--gold);box-shadow:0 0 14px rgba(255,210,58,.8);animation:pulse .6s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
.b.on{transform:scale(.9);background:rgba(255,255,255,.18)}
html.port{}
@media all{
  html.port #joy{width:min(150px,36vw);bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
  html.port #btns{grid-template-columns:repeat(3,min(66px,16.5vw));grid-auto-rows:min(66px,16.5vw);gap:min(10px,2.4vw);bottom:calc(env(safe-area-inset-bottom,0px) + 30px)}
}

/* Overlays */
.ov{position:fixed;inset:0;z-index:10;background:rgba(7,6,15,.9);overflow-y:auto;display:flex;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
.ov>.card{margin:auto;width:100%;max-width:760px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.logo{font-family:var(--f-display);font-size:clamp(34px,calc(var(--lh,1vh) * 8),52px);line-height:1;color:var(--chalk);transform:rotate(-2deg);
  text-shadow:3px 3px 0 var(--red),5px 5px 0 #000}
.logo small{display:block;font:10px var(--f-px);color:var(--gold);text-shadow:none;margin-top:6px;letter-spacing:.06em}
.sel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%}
.ch{background:var(--panel);border:2px solid var(--line);padding:8px 6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--chalk);font-family:var(--f-body);min-width:0}
.ch canvas{width:min(100%,96px);aspect-ratio:64/72;image-rendering:pixelated;background:linear-gradient(#2a1f55,#4a2a6a)}
.ch b{font-family:var(--f-display);font-size:17px;font-weight:400}
.ch em{font-style:normal;font-size:10px;color:var(--dim);font-weight:700}
.ch.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(255,210,58,.45)}
.ch:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.stat{width:100%;display:grid;grid-template-columns:auto 1fr;gap:3px 6px;font-size:10px;align-items:center;text-align:left;color:var(--dim)}
.stat i{height:5px;background:#0a0820;display:block;position:relative}
.stat i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--v);background:var(--gold)}
.sname{font-size:11px;font-weight:900;color:var(--pink)}
.help{font-size:11.5px;color:var(--dim);line-height:1.6;max-width:640px;text-wrap:balance}
.help b{color:var(--chalk)}
.btn{font:900 16px var(--f-body);color:#1a1200;background:var(--gold);border:0;padding:13px 22px;cursor:pointer;box-shadow:0 5px 0 #a87a00;min-width:200px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a87a00}
.btn.ghost{background:transparent;color:var(--chalk);border:2px solid var(--line);box-shadow:none;font-size:14px;padding:11px 16px;min-width:0}
.btn:focus-visible{outline:3px solid var(--chalk);outline-offset:3px}
.res-head{font-family:var(--f-display);font-size:clamp(40px,calc(var(--lh,1vh) * 11),64px);line-height:1}
.res-head.win{color:var(--gold);text-shadow:4px 4px 0 var(--red)}
.res-head.lose{color:var(--dim);text-shadow:4px 4px 0 #000}
.res-sub{font-weight:700;color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%;max-width:520px}
.stats div{background:var(--panel);border:2px solid var(--line);padding:8px 4px}
.stats b{display:block;font:14px var(--f-px);color:var(--gold);margin-top:6px}
.stats span{font-size:11px;color:var(--dim);font-weight:700}
#shareTxt{width:100%;max-width:520px;box-sizing:border-box;background:#05040c;color:var(--chalk);border:1px solid var(--line);font:500 12px var(--f-body);padding:8px;resize:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.phone{width:46px;height:80px;border:4px solid var(--chalk);border-radius:8px;animation:rot 1.6s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#oriOv{z-index:20;background:var(--bg)}
#fsOv{z-index:25;background:var(--bg)}
#fsOv .card{max-width:420px;gap:14px}
#fsOv h2{margin:0;font:400 clamp(22px,6.4vw,30px)/1.25 var(--f-display);color:var(--chalk);text-wrap:balance;text-shadow:2px 2px 0 var(--red)}
#fsOv .sub{margin:0;color:var(--dim);font-size:14px;font-weight:700;line-height:1.5}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;width:100%;text-align:left}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;background:var(--panel);border:2px solid var(--line);padding:10px 12px;font-size:15px;font-weight:700;line-height:1.45}
.steps li>span{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#1a1200;display:grid;place-items:center;font:900 17px var(--f-body)}
.ico{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 4px;border:2px solid var(--chalk);border-radius:7px;font-size:14px;vertical-align:middle;margin:0 2px;box-sizing:border-box}
#fsOv a.btn{display:block;text-decoration:none;box-sizing:border-box;text-align:center}
#fsOv .btn{width:100%;font-size:18px;padding-block:16px}
#fsOv .btn.ghost{font-size:15px;padding-block:12px}
.note{margin:0;font-size:12.5px;color:var(--dim);line-height:1.55}
.note b{color:var(--chalk)}
.arrowDown{font-size:34px;color:var(--gold);animation:bob .8s ease-in-out infinite alternate;line-height:1}
@keyframes bob{to{transform:translateY(8px)}}
.orient{display:flex;gap:8px;justify-content:center}
.orient .btn{min-width:0;padding:9px 16px;font-size:14px}
.orient .btn.on{border-color:var(--gold);color:var(--gold)}
html.rot body{position:fixed;left:0;top:0;width:var(--sw);height:var(--sh);transform-origin:0 0;transform:rotate(90deg) translateY(-100%);overflow:hidden}
.phone{width:46px;height:80px;border:4px solid var(--chalk);border-radius:8px;animation:rot 1.6s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion: reduce){.pop,#callout div.on,#flash.on,.phone,.b.su.ready,.sbar.full i{animation:none}}

/* select screen: always one screen, no scroll */
#selOv{overflow:hidden}
#selOv>.card{margin:0 auto;height:100%;max-width:1000px;gap:calc(var(--lh,1vh)*1.8);justify-content:center}
#selOv .logo{font-size:clamp(26px,calc(var(--lh,1vh)*7.5),52px)}
#selOv .logo small{margin-top:4px;font-size:clamp(7px,calc(var(--lh,1vh)*1.6),10px)}
.sel{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr);flex:0 1 calc(var(--lh,1vh)*60);min-height:0}
html.port .sel{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));flex-basis:calc(var(--lh,1vh)*66)}
.ch{min-height:0;overflow:hidden;gap:2px;padding:6px}
.ch canvas{flex:1 1 0;min-height:0;width:100%;height:auto;aspect-ratio:auto;object-fit:contain}
.ch b{font-size:clamp(13px,calc(var(--lh,1vh)*3.4),18px)}
.ch em{font-size:clamp(8px,calc(var(--lh,1vh)*2.2),10px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stat{font-size:clamp(8px,calc(var(--lh,1vh)*2.2),10px);gap:2px 6px}
.stat i{height:4px}
.sname{font-size:clamp(9px,calc(var(--lh,1vh)*2.4),11px)}
.selhelp{margin:0;font-size:clamp(9px,calc(var(--lh,1vh)*2.4),12px)}
#goBtn{flex:none;padding-block:clamp(8px,calc(var(--lh,1vh)*2.4),13px)}
</style>

</head>
<body>
<div id="game">
  <canvas id="cv" width="320" height="180" aria-label="복싱 대전 화면"></canvas>
  <div id="hud">
    <div class="pl l">
      <canvas class="por" id="por1" width="20" height="20"></canvas>
      <div class="info">
        <div class="nm"><b>1P</b><span id="n1">낭만복서</span></div>
        <div class="hp"><i class="drain" id="d1"></i><i class="fill" id="h1"></i></div>
        <div class="sp"><span>SUPER</span><div class="sbar" id="sb1"><i id="s1"></i></div><div class="dots" id="w1"><i></i><i></i></div></div>
      </div>
    </div>
    <div class="mid"><small>TIME</small><span id="time">60</span></div>
    <div class="pl r">
      <canvas class="por" id="por2" width="20" height="20"></canvas>
      <div class="info">

/* ================= pixel helpers (local coords, +x = forward) ================= */
let g=ctx,OX=0,OY=0,FF=1;
function org(c,x,y,f){g=c;OX=x;OY=y;FF=f;}
function R(lx,ly,w,h,col){g.fillStyle=col;const x=FF>0?OX+lx:OX-lx-w;g.fillRect(Math.round(x),Math.round(OY+ly),Math.round(w),Math.round(h));}
function L(x0,y0,x1,y1,w,col){g.fillStyle=col;const dx=x1-x0,dy=y1-y0,n=Math.ceil(Math.max(Math.abs(dx),Math.abs(dy),1));
  for(let i=0;i<=n;i++){const lx=x0+dx*i/n,ly=y0+dy*i/n;const x=FF>0?OX+lx-w/2:OX-lx-w/2;g.fillRect(Math.round(x),Math.round(OY+ly-w/2),w,w);}}
function fist(ch,x,y,rear){
  const c1=rear?ch.gloveD:ch.glove;
  if(ch.hand==='wrap'){R(x-2,y-2,5,5,c1);R(x-3,y-1,1,3,c1);R(x-2,y+1,5,1,ch.tape);R(x+1,y-2,1,1,'#fff');return;}
  R(x-3,y-2,7,5,c1);R(x-2,y-3,5,7,c1);R(x-2,y+3,5,1,rear?'#000':ch.gloveD);R(x+1,y-2,2,1,'rgba(255,255,255,.55)');
  R(x-4,y-1,1,4,ch.hand==='glove'?'#f3f3f3':c1);
}

/* ================= heads (cx,cy = head centre, facing +x) ================= */
function face(ch,cx,cy,w=11){R(cx-5,cy-6,w,12,ch.skin);R(cx+w-5,cy-1,2,3,ch.skin);R(cx-3,cy+5,6,4,ch.skin);R(cx-2,cy-1,2,3,ch.skinD);}
function drawHead(ch,cx,cy,F){
  const hurt=F&&(F.st==='hitstun'||F.st==='ko');
  const eye=(x,y)=>{if(F&&F.st==='ko'){R(x,y,1,1,'#111');R(x+2,y,1,1,'#111');R(x+1,y+1,1,1,'#111');R(x,y+2,1,1,'#111');R(x+2,y+2,1,1,'#111');}
                    else if(hurt)R(x,y+1,3,1,'#111');else R(x+1,y,2,2,'#141418');};
  switch(ch.head){
  case 'braids':{
    face(ch,cx,cy);
    R(cx-5,cy-7,10,2,ch.skin);R(cx-4,cy-8,8,1,ch.skin);
    R(cx-3,cy-7,3,1,'#f0c09c');
    const br='#4a2a18',br2='#6b3d22';
    const bob=F?Math.sin((F.anim||0)*.15)*.6:0;
    [[cx-4,-7,13],[cx-1,-8,9],[cx+2,-8,7],[cx-6,-5,14]].forEach(([x,y0,len],i)=>{
      for(let k=0;k<len;k++){const xx=x-(k>6?Math.round(bob):0)-(i===3?Math.floor(k/5):0);R(xx,cy+y0+k,1,1,k%2?br:br2);}
    });
    eye(cx+2,cy-2);R(cx+1,cy-4,4,1,'#3a2a20');
    R(cx+2,cy+1,6,1,'#5a3420');R(cx+2,cy+2,1,2,'#5a3420');
    if(hurt||(F&&F.st==='super'))R(cx+3,cy+2,3,2,'#6a2020');else R(cx+3,cy+2,3,1,'#8a4a3a');
    R(cx+1,cy+4,6,4,'#5a3420');R(cx+2,cy+8,4,1,'#5a3420');R(cx+3,cy+4,2,1,ch.skin);
    break;}
  case 'gobong':{
    face(ch,cx,cy,12);R(cx-6,cy-3,2,8,ch.skin);R(cx+5,cy+2,2,3,ch.skin);
    const hc='#121218',hh='#2e2e3c';
    R(cx-7,cy-10,12,5,hc);R(cx-8,cy-8,5,8,hc);R(cx-4,cy-12,10,3,hc);R(cx+4,cy-11,4,3,hc);R(cx+6,cy-9,2,2,hc);
    R(cx-2,cy-11,5,1,hh);R(cx-6,cy-9,3,1,hh);
    R(cx-6,cy-1,1,4,'#2a2a30');
    const gl='#6a4a32';
    R(cx+1,cy-3,7,5,gl);R(cx+2,cy-2,5,3,'#d7e4ef');R(cx-2,cy-2,3,1,gl);
    eye(cx+3,cy-2);
    R(cx+1,cy-5,3,1,'#121218');R(cx+4,cy-6,3,1,'#121218');
    if(hurt||(F&&F.st==='super'))R(cx+3,cy+3,4,2,'#6a2a20');else R(cx+3,cy+3,3,1,'#8a4a3a');
    R(cx+4,cy+1,2,1,'#e89a80');
    break;}
  case 'pigeon':{
    const p='#3d4a5c',p2='#4f6075',p3='#2b3443';
    R(cx-6,cy-8,12,13,p);R(cx-5,cy-9,10,1,p);R(cx-7,cy-4,1,8,p);R(cx+6,cy-6,1,7,p);
    R(cx-4,cy-8,5,2,p2);R(cx-6,cy+1,2,4,p3);
    R(cx-6,cy+4,12,7,'#2a5a52');R(cx-5,cy+5,9,3,'#3fbf8a');R(cx-3,cy+6,5,2,'#6fe0a6');R(cx-6,cy+9,12,2,'#5a3f7a');
    R(cx+1,cy-5,4,4,'#c96a3a');R(cx+2,cy-4,2,2,'#1a1414');
    if(hurt){R(cx+1,cy-3,4,1,'#1a1414');}
    R(cx+6,cy-2,4,2,'#2a2a30');R(cx+9,cy-1,1,1,'#2a2a30');R(cx+5,cy-3,2,1,'#e8e8ee');
    break;}
  case 'candy':{
    face(ch,cx,cy);
    const bl='#f2d27a',bl2='#d9b25a',bl3='#fff0b8';

    R(cx+2,cy-8,5,3,bl);R(cx+5,cy-6,2,3,bl);
    R(cx-5,cy-8,5,1,bl3);R(cx-8,cy-3,1,6,bl3);R(cx-9,cy+3,2,1,bl3);

}

/* ================= pose + body ================= */
function pose(F){
  const p={lean:0,cr:0,fr:[14,-48],rr:[8,-45],step:0,tilt:0,hookE:false};
  const br=Math.sin((F.anim||0)*.12)*.8;p.fr[1]+=br;p.rr[1]+=br*.7;
  switch(F.st){
    case 'walk':p.step=Math.sin(F.walkT*.25)*4;break;
    case 'crouch':p.cr=10;p.fr=[12,-47];p.rr=[8,-45];break;
    case 'block':case 'blockstun':p.cr=F.ctrl&&F.ctrl.down?10:2;p.fr=[11,-53];p.rr=[10,-47];break;
    case 'hitstun':p.lean=-4;p.fr=[9,-43];p.rr=[5,-41];p.tilt=-1;break;
    case 'ko':p.lean=-5;p.fr=[4,-40];p.rr=[0,-38];break;
    case 'win':p.rr=[3,-70];p.fr=[13,-49];break;
    case 'attack':{
      const m=F.md,f=F.mf;let e=f<m.s?-.3*f/m.s:f<m.s+m.a?1:1-(f-m.s-m.a)/m.r;const ep=Math.max(0,e);
      if(F.move==='jab')p.fr=[14+18*e,-48];
      else if(F.move==='straight'){p.rr=[8+27*e,-48];p.lean=3*ep;p.step=2*ep;}
      else if(F.move==='hook'){p.fr=[6+17*ep-(e<0?4:0),-53+2*ep];p.lean=2*e;p.hookE=true;}
      else if(F.move==='upper'){p.cr=6*(1-ep);p.rr=[8+11*ep,-34-28*ep];p.lean=1;}
      else if(F.move==='body'){p.cr=8;p.fr=[14+17*ep,-44];p.rr=[8,-48];p.lean=2*ep;}
      break;}
    case 'super':{
      const k=F.sk,f=F.mf;
      if(k==='rush'||k==='spin'){const ph=Math.floor(f/4)%2;p.fr=ph?[31,-48]:[14,-46];p.rr=ph?[8,-45]:[33,-47];p.lean=3;p.step=Math.sin(f*.5)*4;}
      else if(k==='bigupper'){if(f<20){p.cr=11;p.rr=[2,-34];p.fr=[12,-50];}else{p.rr=[18,-74];p.lean=2;p.fr=[10,-48];}}
      else if(k==='pigeons'){p.fr=[10,-66];p.rr=[4,-64];p.cr=Math.sin(f*.4)*2;}
      break;}
  }
  return p;
}
function drawFighter(c,F,x,y){
  const ch=F.ch,p=pose(F);let f=F.f;
  if(F.st==='super'&&F.sk==='spin'&&F.mf>4&&F.mf<40)f=(Math.floor(F.mf/4)%2)?-f:f;
  c.save();
  if(F.st==='ko'){const a=Math.min(1,F.koT/18)*1.5*(-F.f);c.translate(x,y);c.rotate(a);c.translate(-x,-y);}
  org(c,x,y,f);
  const cr=p.cr,shY=-46+cr,hipY=-26+cr*.6,lean=p.lean,Wd=ch.width;
  const fF=[8+p.step,0],fR=[-8-p.step*.6,0],hF=[2,hipY],hR=[-2,hipY];
  const knee=(h,ft)=>[(h[0]+ft[0])/2+2+cr*.35,(h[1]+ft[1])/2];
  const sR=[lean-3,shY+3],sF=[lean+3,shY+3];
  const gR=[p.rr[0],p.rr[1]+cr],gF=[p.fr[0],p.fr[1]+cr];
  const armCol=(rear,upper)=>{
    if(ch.top==='jacket')return rear?ch.topD:ch.topC;
    if(ch.top==='tee'&&upper)return rear?ch.topD:ch.topC;
    return rear?ch.skinD:ch.skin;};
  const arm=(s,gl,rear,hook)=>{
    const m=[(s[0]+gl[0])/2-2,(s[1]+gl[1])/2+(hook?-3:4)];
    L(s[0],s[1],m[0],m[1],4,armCol(rear,true));
    L(m[0],m[1],gl[0]-2,gl[1],ch.top==='jacket'?4:3,armCol(rear,false));
    if(ch.top==='jacket'&&ch.neon)L(m[0],m[1]-1,gl[0]-3,gl[1]-1,1,rear?'#7a2758':ch.neon);
    fist(ch,gl[0],gl[1],rear);};
  const leg=(h,ft,rear)=>{
    const k=knee(h,ft);const up=ch.legs==='pants'?ch.legC:ch.legC,lo=ch.legs==='pants'?ch.legC:(rear?ch.skinD:ch.skin);
    L(h[0],h[1],k[0],k[1],5,rear&&ch.legs==='pants'?'#0e0e14':up);
    L(k[0],k[1],ft[0],ft[1]-3,ch.legs==='pants'?5:4,rear&&ch.legs==='pants'?'#0e0e14':lo);
    if(ch.sock)R(ft[0]-2,-6,5,2,ch.sock);
    R(ft[0]-3,-3,8,3,ch.shoe);if(ch.shoeAcc)R(ft[0]-1,-4,3,1,ch.shoeAcc);
    if(ch.id==='pigeon')R(ft[0]-3,-6,7,3,ch.shoe);};
  // rear arm + legs
  arm(sR,gR,true,false);
  leg(hR,fR,true);leg(hF,fF,false);
  // shorts
  if(ch.legs==='shorts'){R(-7,hipY-3,15,10,ch.legC);R(-7,hipY-3,15,1,'#2a2a32');
    R(5,hipY-2,1,9,ch.stripe);if(ch.stripe2)R(6,hipY-2,1,9,ch.stripe2);}
  else{R(-7,hipY-3,15,8,ch.legC);}
  // torso
  const rows=hipY-shY;
  for(let i=0;i<=rows;i++){const off=lean*(1-i/rows),yy=shY+i;
    let col=ch.top==='tank'?(i<3?ch.skin:ch.topC):ch.topC;
    R(-Wd/2+off,yy,Wd,1,col);
    if(ch.top==='tank'&&i>=3){R(-Wd/2+off,yy,1,1,ch.skin);R(Wd/2+off-1,yy,1,1,ch.skin);}
    if(ch.top==='jacket'&&i>1){R(Wd/2+off-3,yy,1,1,'#3a3a46');}
    if(ch.neon&&i>2)R(-Wd/2+off,yy,1,1,ch.neon);
  }
  if(ch.top==='tank'){R(-Wd/2+lean+2,shY,2,3,ch.topC);R(Wd/2+lean-4,shY,2,3,ch.topC);R(lean+1,shY+6,3,1,ch.skinD);}
  if(ch.top==='jacket'){R(-Wd/2+lean-1,shY-2,Wd+1,4,ch.collar);R(lean+2,shY+1,3,3,'#1c2240');}
  if(ch.top==='tee'){R(lean-2,shY,6,2,'#2a2a30');}
  // head
  drawHead(ch,lean+1+p.tilt,shY-8,F);
  // front arm
  arm(sF,gF,false,p.hookE);
  c.restore();

function updateFighter(F,O){
  F.anim++;const c=F.ctrl;
  if(c.press){F.buf=c.press;F.bufT=8;c.press=null;}else if(F.bufT>0)F.bufT--;else F.buf=null;
  const canAct=mode==='fight';
  switch(F.st){

    case 'ko':F.x+=F.vx;F.vx*=.96;F.vy+=.35;F.y+=F.vy;if(F.y>=0){F.y=0;F.vy=0;F.vx*=.5;}F.koT++;break;
    case 'win':break;
    case 'attack':{
      F.mf++;const m=F.md;
      if(!F.hitDone&&F.mf>=m.s&&F.mf<m.s+m.a){
        const d=Math.abs(O.x-F.x);if(d<=m.range+6&&Math.sign(O.x-F.x)===F.f){F.hitDone=true;applyHit(F,O,m);}}
      if(canAct&&F.buf&&F.hitLanded&&F.mf>=m.s){const mv=resolveMove(F.buf,c);
        if(mv==='super'&&F.sup>=100){startSuper(F);F.buf=null;break;}
        if(m.cancel.includes(mv)){startMove(F,mv);F.buf=null;break;}}
      if(F.mf>=m.s+m.a+m.r)F.st='idle';
      break;}
    case 'super':superUpdate(F,O);break;
    default:{
      F.f=O.x>F.x?1:-1;
      if(canAct&&F.buf){const mv=resolveMove(F.buf,c);
        if(mv==='super'){if(F.sup>=100){startSuper(F);F.buf=null;break;}}
        else{startMove(F,mv);F.buf=null;break;}}
      if(!canAct){F.st='idle';break;}
      if(c.guard)F.st='block';
      else if(c.down)F.st='crouch';
      else if(c.dir){F.st='walk';const back=c.dir===-F.f;F.x+=c.dir*1.05*F.ch.walk*(back?.72:1);F.walkT++;}

  if(--F.ai.wait>0)return;F.ai.wait=4+(Math.random()*7|0);
  const d=Math.abs(O.x-F.x),tw=Math.sign(O.x-F.x),lvl=F.ai.lvl;
  c.down=false;c.guard=false;c.dir=0;
  if(!isFree(F))return;
  const oAtk=(O.st==='attack'&&O.mf<O.md.s+O.md.a)||O.st==='super';
  if(oAtk&&d<52&&Math.random()<lvl*.85){
    if(O.st==='attack'&&MOVES[O.move].high&&Math.random()<.35)c.down=true;else c.guard=true;
    F.ai.wait=12;return;}
  if(O.st==='attack'&&O.mf>=O.md.s+O.md.a&&d<40&&Math.random()<lvl){c.press=Math.random()<.5?'straight':'hook';F.ai.chain=true;return;}
  if(O.st==='crouch'&&d<30&&Math.random()<.6){c.press='upper';return;}
  if(F.sup>=100&&d<40&&Math.random()<.4){c.press='super';return;}
  if(d>42){c.dir=Math.random()<.82?tw:0;return;}
  if(d<27&&Math.random()<.35){c.dir=-tw;F.ai.wait=10;return;}
  if(Math.random()<.18){c.guard=true;F.ai.wait=14;return;}
  const r=Math.random();c.press=r<.36?'jab':r<.6?'straight':r<.74?'hook':r<.86?'upper':'body';

/* ================= main step ================= */
let dr1=100,dr2=100;
function step(){
  if(paused||mode==='select'||mode==='result')return;
  if(superFreeze>0){superFreeze--;if(superFreeze===0)clearCallout();return;}
  if(hitstop>0){hitstop--;return;}
  if(mode==='intro'){introT--;
    if(introT===95)callout(round===3?'FINAL ROUND':`ROUND ${round}`);
    if(introT===35){callout('FIGHT!');sfx.bell();}
    if(introT<=0){mode='fight';clearCallout();}
  }
  if(mode==='fight'){timer-=1/60;if(timer<=0){timer=0;timeOver();}}
  if(mode==='end'){endT++;
    if(endT===70&&rWin&&isFree(rWin)){rWin.st='win';callout(rWin===P1?'YOU WIN':'YOU LOSE');}
    if(endT===70&&!rWin)callout('무승부');
    if(endT>=160){clearCallout();afterRound();return;}}
  // inputs
  P1.ctrl.dir=inp.dir;P1.ctrl.down=inp.down;P1.ctrl.guard=inp.guard;if(inp.press){P1.ctrl.press=inp.press;inp.press=null;}
  if(mode==='fight')cpuThink(P2,P1);else{P2.ctrl.dir=0;P2.ctrl.guard=false;P2.ctrl.down=false;}
  updateFighter(P1,P2);updateFighter(P2,P1);
  // push apart
  if(P1.st!=='ko'&&P2.st!=='ko'){const dx=P2.x-P1.x,ad=Math.abs(dx);if(ad<26){const o=(26-ad)/2*(dx>=0?1:-1);P1.x-=o;P2.x+=o;}}
  for(const F of [P1,P2])F.x=clamp(F.x,WALL_L,WALL_R);
  // projectiles
  for(const p of projs){p.x+=p.vx;p.t++;const T=p.owner===P1?P2:P1;
    if(!p.done&&T.st!=='ko'&&Math.abs(p.x-T.x)<10){p.done=true;applyHit(p.owner,T,{dmg:6,kb:1.6,hs:14,high:false,gain:0,sup:true});}}
  projs=projs.filter(p=>!p.done&&p.x>-20&&p.x<W+20);
  for(const s of sparks)s.t++;sparks=sparks.filter(s=>s.t<10);
  shake*=.86;
}

/* ================= render ================= */
function drawPigeonBird(p){
  const fl=Math.floor(p.t/4)%2;org(ctx,p.x,p.y,Math.sign(p.vx));
  R(-4,-2,8,4,'#5a6880');R(-6,-1,2,2,'#3d4a5c');R(3,-4,4,4,'#3d4a5c');R(5,-3,1,1,'#ff8a3a');R(7,-2,2,1,'#2a2a30');R(2,0,2,2,'#3fbf8a');
  if(fl)R(-2,-6,5,4,'#7a88a0');else R(-2,2,5,3,'#7a88a0');
}
function drawSpark(s){
  const k=s.t,col=s.kind==='block'?'#7fc4ff':'#fff2a0',col2=s.kind==='block'?'#3f7bff':'#ff8a3a';
  ctx.fillStyle=col2;const r=3+k*1.6;
  for(let i=0;i<8;i++){const a=i*Math.PI/4+.3;ctx.fillRect(Math.round(s.x+Math.cos(a)*r)-1,Math.round(s.y+Math.sin(a)*r)-1,2,2);}
  if(k<5){ctx.fillStyle=col;ctx.fillRect(s.x-5+k,s.y-1,10-2*k,2);ctx.fillRect(s.x-1,s.y-5+k,2,10-2*k);}
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  if(!RM&&shake>.3)ctx.translate(Math.round(rand(-shake,shake)),Math.round(rand(-shake,shake)));
  ctx.drawImage(bg,0,0);
  if(!P1)return;
  if(superFreeze>0){ctx.fillStyle='rgba(10,0,30,.55)';ctx.fillRect(-10,-10,W+20,H+20);}
  for(const F of [P1,P2]){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(Math.round(F.x-12),GROUND-1,24,3);}
  const order=lastAtk===P1?[P2,P1]:[P1,P2];
  for(const F of order)drawFighter(ctx,F,F.x,GROUND+F.y);
  for(const p of projs)drawPigeonBird(p);
  ctx.setTransform(1,0,0,1,0,0);
  for(const s of sparks)drawSpark(s);
}
